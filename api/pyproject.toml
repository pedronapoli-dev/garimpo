[project]
name = "api"
version = "0.1.0"
description = "Garimpo API: community-driven music curation"
readme = "README.md"
authors = [
    { name = "Pedro Nápoli", email = "pedro_ncva@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.163.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app/services"]

[tool.coverage.report]
fail_under = 100
show_missing = true


[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.ruff.lint.isort]
# Editors that run ruff from the repository root cannot detect these on their own.
known-first-party = ["app", "evals", "main", "migrations"]

[tool.pyright]
# The same checker and mode as Pylance in .vscode/settings.json, so CI fails on
# what the editor underlines.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["app", "evals", "main.py", "migrations", "tests"]
